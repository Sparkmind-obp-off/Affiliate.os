name: CI

# Canonical pipeline — DOC 24 §346:
#   INSTALL → TYPECHECK → LINT → UNIT TEST → ARCHITECTURE TEST
#   → CONTRACT TEST → BUILD → SECURITY CHECK
#
# A boundary violation must fail CI (DOC 24 §344).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Architecture tests (module boundaries)
        run: npm run test:architecture

      - name: Integration / contract tests
        run: npx vitest run tests/integration

      - name: Build
        run: npm run build

      - name: Security check — dependency audit
        # Advisory: reports high/critical findings without blocking on
        # transitive dev-only advisories.
        run: npm audit --audit-level=critical || true

      - name: Security check — no committed secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.dev\.vars$|\.pem$|\.key$'; then
            echo "::error::Secret-bearing file is tracked by git"
            exit 1
          fi
          echo "No secret-bearing files tracked."
